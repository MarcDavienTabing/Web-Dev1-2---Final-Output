<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comments - Meteor Meat</title>

    <link rel="stylesheet" href="comments.css">
</head>

<body>

    <div class="comments-container">

        <!-- Navigation -->
        <div class="card nav">
            <nav>
                <h1>Meteor Meat!</h1>

                <ul>
                    <li>
                        <a href="index.html">Home</a>
                        <a href="menu.html">Menu</a>
                        <a href="order.html">Order</a>
                        <a href="about.html">About</a>
                        <a href="contact.html">Contact Us</a>
                        <a href="comments.html">Comments</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Page Header -->
        <div class="card header">
            <h1>Customer Comments</h1>
            <p>We would love to hear your thoughts!</p>
        </div>

        <!-- Weather (Open-Meteo public API) -->
        <div class="card weather-card">
            <h2>Weather in Imus, Cavite</h2>
            <p id="weatherStatus">Loading weather...</p>
            <div id="weatherInfo" hidden>
                <p class="weather-temp"><span id="weatherTemp"></span></p>
                <p id="weatherDesc"></p>
                <p class="weather-details">
                    Feels like <span id="weatherFeels"></span> &middot;
                    Humidity <span id="weatherHumidity"></span> &middot;
                    Wind <span id="weatherWind"></span>
                </p>
            </div>
        </div>

        <!-- Comment Form -->
        <div class="card form-card">

            <h2>Leave a Comment</h2>

            <form id="commentForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter a username"
                    maxlength="30"
                    autocomplete="off"
                    required
                >

                <label for="comment">Your Comment</label>
                <textarea
                    id="comment"
                    placeholder="Share your experience with Meteor Meat..."
                    maxlength="500"
                    required
                ></textarea>

                <button type="submit" id="submitBtn">
                    Post Comment
                </button>

            </form>

            <p id="message" role="status"></p>

        </div>

        <!-- Display Comments -->
        <div class="card display-card">

            <h2>What People Are Saying</h2>

            <div id="commentList"></div>

        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Meteor Meat! All Rights Reserved.</p>
        </footer>

    </div>

    <script src="comments.js"></script>

</body>
</html>
